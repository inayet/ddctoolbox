  "*.svg",
  "**/lazy-lock.json",
  "*.conf",
  "*.rasi",
  "*.css",
  # "*.json",
  # "home-manager/programs/nwg-dock-hyprland/nwg-dock-pinned",
  # "home-manager/programs/direnv/direnvrc",
  ".sops.yaml",
  "facter.json",
  "my-nix-index/ad-hoc-download-nix-index-db.sh",
  # "sops-nix-secrets/sops-nix-networks.nix",
  ".direnv/*",
  "flake-parts-structure",
  "*.bkup",
  "*.envrc",
