[formatter.nixfmt]
command = "nixfmt"
includes = ["*.nix"]
excludes = ["**docs/*", "**/.direnv", "**/.bak", "**/secrets/**", "secrets/**", "nix-index/*"]

[formatter.shfmt]
command = "shfmt"
excludes = ["**/secrets/**", "secrets/**"]
includes = ["*.sh", "*.bash", "*.envrc", "*.envrc.*"]

[formatter.toml-sort]
command = "toml-sort"
excludes = ["**/.direnv", "**/.bak", "**/secrets/**", "secrets/**", "nix-index/*"]
includes = ["*.toml"]
options = ["-i"]

[formatter.yamlfmt]
command = "yamlfmt"
excludes = ["**/secrets/**", "secrets/**", "**.sops.yaml"]
includes = ["*.yaml"]

[global]
excludes = [
  "*./docs",
  "*docs",
  "docs/*",
  "**.lock",
  "flake.lock",
  "**/.gitignore",
  "**/.gitmodules",
  ".gitignore",
  ".gitmodules",
  "LICENSE",
  # "systems/discovery/firmware/*",
  "./secrets/**",
  "**/secrets/**",
  # "assets/wallpapers",
  "secrets/**",
  "*.bk",
  "*.pdf",
  "*.bak",
  "*.text",
  "*.txt",
  "*.ini",
  "*.png",
  "*.jpg",
  "*.md",
  "*.mp3",
  "*.icon",
  # "home-manager/programs/files/*",
